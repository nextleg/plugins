name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io with GitHub OIDC (no secrets).
# https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher
        run: scripts/install-mcp-publisher.sh
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Skip if this version is already published
        id: exists
        run: |
          v=$(jq -r .version server.json)
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers/io.github.nextleg%2Fnextleg/versions/$v" > /dev/null; then
            echo "already published $v"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate
        if: steps.exists.outputs.published != 'true'
        run: ./mcp-publisher validate
      - name: Log in with GitHub OIDC
        if: steps.exists.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: ./mcp-publisher publish
