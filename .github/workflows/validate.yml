name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifests
        run: node scripts/validate.mjs
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate server.json against the MCP Registry
        run: |
          scripts/install-mcp-publisher.sh
          ./mcp-publisher validate
      - name: Install from this checkout with the Codex CLI
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" @openai/codex@0.171.0
          codex="$RUNNER_TEMP/codex/node_modules/.bin/codex"
          mkdir -p "$CODEX_HOME"
          "$codex" plugin marketplace add "$GITHUB_WORKSPACE"
          "$codex" plugin add nextleg@nextleg
          "$codex" plugin list | grep -q "nextleg@nextleg .*installed, enabled"
          "$codex" mcp list | grep -q "https://mcp.getnextleg.com/mcp"
